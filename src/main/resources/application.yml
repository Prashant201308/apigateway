server:
  port: 8083

spring:
  application:
    name: apigateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: orderdetails
              uri: lb://ORDERDETAILS
              predicates:
                - Path=/orders/**

            - id: userdetails
              uri: lb://USERDETAILS
              predicates:
                - Path=/users/**

            - id: rinkuteam
              uri: lb://RINKUTEAM
              predicates:
                - Path=/gangs/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/